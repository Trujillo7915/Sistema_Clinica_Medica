<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Sombra suave para cajas -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12" flood-color="#0f172a" />
    </filter>

    <!-- Marcador Herencia (Triangulo blanco) -->
    <marker id="inheritance" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
      <polygon points="0 0, 14 7, 0 14" fill="#ffffff" stroke="#334155" stroke-width="1.8" />
    </marker>

    <!-- Marcador Composicion (Rombo relleno) -->
    <marker id="composition" markerWidth="14" markerHeight="14" refX="0" refY="7" orient="auto">
      <polygon points="0 7, 7 2, 14 7, 7 12" fill="#1e293b" stroke="#1e293b" stroke-width="1.5" />
    </marker>

    <!-- Marcador Flecha Asociacion / Dependencia -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polyline points="0 1, 9 5, 0 9" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>

    <!-- Marcador Dependencia (Guiones) -->
    <marker id="dashed-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polyline points="0 1, 9 5, 0 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" />
    </marker>
  </defs>

  <!-- ================= ENCABEZADO ================= -->
  <rect x="30" y="20" width="1220" height="70" rx="8" fill="#1e293b" filter="url(#shadow)" />
  <text x="50" y="48" fill="#ffffff" font-size="19" font-weight="700" letter-spacing="0.5">SISTEMA DE GESTION DE CLINICA MEDICA (SGCM) — DIAGRAMA DE CLASES DE DOMINIO</text>
  <text x="50" y="72" fill="#94a3b8" font-size="13">Fase 3: Modelado UML Orientado a Objetos (MVP) | Trazabilidad con HU-01 a HU-10 y Reglas de Negocio RN-01 a RN-08</text>

  <!-- ================= LINEAS DE RELACION ================= -->
  <!-- Herencia Paciente a Persona -->
  <path d="M 350 330 L 350 250 L 530 250 L 530 234" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#inheritance)" />

  <!-- Herencia Medico a Persona -->
  <path d="M 910 330 L 910 250 L 690 250 L 690 234" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#inheritance)" />

  <!-- Composicion Paciente a HistoriaClinica -->
  <path d="M 230 405 L 155 405 L 155 520" fill="none" stroke="#1e293b" stroke-width="2" marker-start="url(#composition)" />
  <text x="238" y="398" font-size="12" font-weight="600" fill="#1e293b">1</text>
  <text x="165" y="510" font-size="12" font-weight="600" fill="#1e293b">1</text>
  <text x="160" y="445" font-size="11" font-style="italic" fill="#475569">contiene (1:1)</text>

  <!-- Composicion HistoriaClinica a RegistroConsulta -->
  <path d="M 155 670 L 155 720" fill="none" stroke="#1e293b" stroke-width="2" marker-start="url(#composition)" />
  <text x="165" y="688" font-size="12" font-weight="600" fill="#1e293b">1</text>
  <text x="165" y="715" font-size="12" font-weight="600" fill="#1e293b">0..*</text>
  <text x="165" y="700" font-size="11" font-style="italic" fill="#475569">registra</text>

  <!-- Asociacion Paciente a Cita -->
  <path d="M 470 415 L 520 415 L 520 520" fill="none" stroke="#334155" stroke-width="1.8" />
  <text x="475" y="408" font-size="12" font-weight="600" fill="#334155">1</text>
  <text x="528" y="510" font-size="12" font-weight="600" fill="#334155">0..*</text>
  <text x="480" y="455" font-size="11" font-style="italic" fill="#475569">solicita</text>

  <!-- Asociacion Medico a Cita -->
  <path d="M 790 415 L 740 415 L 740 520" fill="none" stroke="#334155" stroke-width="1.8" />
  <text x="775" y="408" font-size="12" font-weight="600" fill="#334155">1</text>
  <text x="720" y="510" font-size="12" font-weight="600" fill="#334155">0..*</text>
  <text x="750" y="455" font-size="11" font-style="italic" fill="#475569">atiende</text>

  <!-- Dependencia Cita a EstadoCita -->
  <path d="M 760 595 L 850 595" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#dashed-arrow)" />
  <text x="772" y="588" font-size="11" font-style="italic" fill="#64748b">&#171;usa&#187;</text>

  <!-- Asociacion RegistroConsulta a Medico -->
  <path d="M 285 805 L 1110 805 L 1110 405 L 1030 405" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="295" y="798" font-size="12" font-weight="600" fill="#334155">0..*</text>
  <text x="1038" y="398" font-size="12" font-weight="600" fill="#334155">1</text>
  <text x="700" y="798" font-size="11" font-style="italic" fill="#475569">registrado por (medico tratante)</text>

  <!-- Asociacion RegistroConsulta a Cita (vinculo de atencion) -->
  <path d="M 285 750 L 580 750 L 580 715" fill="none" stroke="#334155" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <text x="295" y="742" font-size="12" font-weight="600" fill="#334155">0..1</text>
  <text x="590" y="710" font-size="12" font-weight="600" fill="#334155">1</text>
  <text x="390" y="742" font-size="11" font-style="italic" fill="#475569">asociado a cita atendida (RN-06)</text>

  <!-- ================= CLASE: PERSONA (Abstracta) ================= -->
  <g transform="translate(485, 115)" filter="url(#shadow)">
    <rect width="250" height="115" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.8" />
    <path d="M 0 0 L 250 0 L 250 42 L 0 42 Z" fill="#f1f5f9" />
    <text x="125" y="18" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">&#171;abstract&#187;</text>
    <text x="125" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Persona</text>
    <line x1="0" y1="42" x2="250" y2="42" stroke="#cbd5e1" stroke-width="1.2" />
    
    <!-- Atributos -->
    <text x="12" y="60" font-size="12" fill="#334155">- id : String / Long</text>
    <text x="12" y="76" font-size="12" fill="#334155">- nombre : String</text>
    <text x="12" y="92" font-size="12" fill="#334155">- edad : Integer</text>
    <text x="12" y="108" font-size="12" fill="#334155">- telefono : String</text>
  </g>

  <!-- ================= CLASE: PACIENTE ================= -->
  <g transform="translate(230, 330)" filter="url(#shadow)">
    <rect width="240" height="150" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" />
    <path d="M 0 0 L 240 0 L 240 32 L 0 32 Z" fill="#eff6ff" />
    <text x="120" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Paciente</text>
    <line x1="0" y1="32" x2="240" y2="32" stroke="#bfdbfe" stroke-width="1.2" />

    <!-- Atributos -->
    <text x="12" y="50" font-size="12" fill="#334155">- direccion : String</text>
    <text x="12" y="66" font-size="12" fill="#334155">- historiaClinica : HistoriaClinica</text>
    <line x1="0" y1="74" x2="240" y2="74" stroke="#e2e8f0" stroke-width="1" />

    <!-- Metodos -->
    <text x="12" y="92" font-size="11.5" fill="#1e293b">+ getDireccion() : String</text>
    <text x="12" y="108" font-size="11.5" fill="#1e293b">+ setDireccion(dir: String) : void</text>
    <text x="12" y="124" font-size="11.5" fill="#1e293b">+ getHistoriaClinica() : HistoriaClinica</text>
    <text x="12" y="140" font-size="11.5" fill="#1e293b">+ validarTelefono() : Boolean</text>
  </g>

  <!-- ================= CLASE: MEDICO ================= -->
  <g transform="translate(790, 330)" filter="url(#shadow)">
    <rect width="240" height="165" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.8" />
    <path d="M 0 0 L 240 0 L 240 32 L 0 32 Z" fill="#f0fdfa" />
    <text x="120" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">Medico</text>
    <line x1="0" y1="32" x2="240" y2="32" stroke="#99f6e4" stroke-width="1.2" />

    <!-- Atributos -->
    <text x="12" y="50" font-size="12" fill="#334155">- especialidad : String</text>
    <text x="12" y="66" font-size="12" fill="#334155">- activo : Boolean = true</text>
    <line x1="0" y1="74" x2="240" y2="74" stroke="#e2e8f0" stroke-width="1" />

    <!-- Metodos -->
    <text x="12" y="92" font-size="11.5" fill="#1e293b">+ getEspecialidad() : String</text>
    <text x="12" y="108" font-size="11.5" fill="#1e293b">+ isActivo() : Boolean</text>
    <text x="12" y="124" font-size="11.5" fill="#1e293b">+ setActivo(activo: Boolean) : void</text>
    <text x="12" y="140" font-size="11.5" fill="#1e293b">+ darDeBaja() : Boolean</text>
    <text x="12" y="156" font-size="11.5" fill="#1e293b">+ validarEdadLaboral() : Boolean</text>
  </g>

  <!-- ================= CLASE: HISTORIA CLINICA ================= -->
  <g transform="translate(30, 520)" filter="url(#shadow)">
    <rect width="250" height="150" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" />
    <path d="M 0 0 L 250 0 L 250 32 L 0 32 Z" fill="#f5f3ff" />
    <text x="125" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">HistoriaClinica</text>
    <line x1="0" y1="32" x2="250" y2="32" stroke="#ddd6fe" stroke-width="1.2" />

    <!-- Atributos -->
    <text x="12" y="50" font-size="12" fill="#334155">- id : Long</text>
    <text x="12" y="66" font-size="12" fill="#334155">- fechaCreacion : LocalDate</text>
    <text x="12" y="82" font-size="12" fill="#334155">- registros : List&lt;RegistroConsulta&gt;</text>
    <line x1="0" y1="90" x2="250" y2="90" stroke="#e2e8f0" stroke-width="1" />

    <!-- Metodos -->
    <text x="12" y="108" font-size="11.5" fill="#1e293b">+ agregarRegistro(reg) : void</text>
    <text x="12" y="124" font-size="11.5" fill="#1e293b">+ getRegistrosOrdenados() : List</text>
    <text x="12" y="140" font-size="11.5" fill="#1e293b">+ tieneRegistros() : Boolean</text>
  </g>

  <!-- ================= CLASE: CITA ================= -->
  <g transform="translate(500, 520)" filter="url(#shadow)">
    <rect width="260" height="195" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.8" />
    <path d="M 0 0 L 260 0 L 260 32 L 0 32 Z" fill="#fff7ed" />
    <text x="130" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">Cita</text>
    <line x1="0" y1="32" x2="260" y2="32" stroke="#fed7aa" stroke-width="1.2" />

    <!-- Atributos -->
    <text x="12" y="50" font-size="12" fill="#334155">- id : Long</text>
    <text x="12" y="66" font-size="12" fill="#334155">- fechaHora : LocalDateTime</text>
    <text x="12" y="82" font-size="12" fill="#334155">- estado : EstadoCita</text>
    <text x="12" y="98" font-size="12" fill="#334155">- paciente : Paciente</text>
    <text x="12" y="114" font-size="12" fill="#334155">- medico : Medico</text>
    <line x1="0" y1="122" x2="260" y2="122" stroke="#e2e8f0" stroke-width="1" />

    <!-- Metodos -->
    <text x="12" y="140" font-size="11.5" fill="#1e293b">+ agendar() : Boolean</text>
    <text x="12" y="156" font-size="11.5" fill="#1e293b">+ cancelar() : Boolean</text>
    <text x="12" y="172" font-size="11.5" fill="#1e293b">+ marcarAtendida() : void</text>
    <text x="12" y="188" font-size="11.5" fill="#1e293b">+ validarConflicto(med, f) : Boolean</text>
  </g>

  <!-- ================= ENUM: ESTADO CITA ================= -->
  <g transform="translate(850, 535)" filter="url(#shadow)">
    <rect width="180" height="115" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.8" />
    <path d="M 0 0 L 180 0 L 180 38 L 0 38 Z" fill="#f8fafc" />
    <text x="90" y="16" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">&#171;enumeration&#187;</text>
    <text x="90" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">EstadoCita</text>
    <line x1="0" y1="38" x2="180" y2="38" stroke="#cbd5e1" stroke-width="1.2" />

    <!-- Constantes -->
    <text x="15" y="58" font-size="12" font-weight="600" fill="#0369a1">+ AGENDADA</text>
    <text x="15" y="78" font-size="12" font-weight="600" fill="#15803d">+ ATENDIDA</text>
    <text x="15" y="98" font-size="12" font-weight="600" fill="#b91c1c">+ CANCELADA</text>
  </g>

  <!-- ================= CLASE: REGISTRO CONSULTA ================= -->
  <g transform="translate(30, 720)" filter="url(#shadow)">
    <rect width="255" height="175" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.8" />
    <path d="M 0 0 L 255 0 L 255 32 L 0 32 Z" fill="#fef3c7" />
    <text x="127" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">RegistroConsulta</text>
    <line x1="0" y1="32" x2="255" y2="32" stroke="#fde68a" stroke-width="1.2" />

    <!-- Atributos -->
    <text x="12" y="50" font-size="12" fill="#334155">- id : Long</text>
    <text x="12" y="66" font-size="12" fill="#334155">- fechaHora : LocalDateTime</text>
    <text x="12" y="82" font-size="12" fill="#334155">- diagnostico : String</text>
    <text x="12" y="98" font-size="12" fill="#334155">- tratamiento : String</text>
    <text x="12" y="114" font-size="12" fill="#334155">- medicoTratante : Medico</text>
    <line x1="0" y1="122" x2="255" y2="122" stroke="#e2e8f0" stroke-width="1" />

    <!-- Metodos -->
    <text x="12" y="140" font-size="11.5" fill="#1e293b">+ getDiagnostico() : String</text>
    <text x="12" y="156" font-size="11.5" fill="#1e293b">+ getTratamiento() : String</text>
    <text x="12" y="172" font-size="11.5" fill="#1e293b">+ getFechaHora() : LocalDateTime</text>
  </g>

  <!-- ================= PANEL: REGLAS Y CONVENCIONES ================= -->
  <g transform="translate(680, 700)" filter="url(#shadow)">
    <rect width="570" height="195" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M 0 0 L 570 0 L 570 30 L 0 30 Z" fill="#f1f5f9" />
    <text x="15" y="20" font-size="13" font-weight="700" fill="#334155">CONVENCIONES Y REGLAS DE NEGOCIO EN EL MODELO</text>
    <line x1="0" y1="30" x2="570" y2="30" stroke="#e2e8f0" stroke-width="1.2" />

    <!-- Simbolos UML -->
    <polygon points="18 42, 28 47, 18 52" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <text x="35" y="50" font-size="11" font-weight="600" fill="#334155">Herencia / Generalizacion (Persona es clase base abstracta de Paciente y Medico)</text>

    <polygon points="18 64, 23 60, 28 64, 23 68" fill="#1e293b" stroke="#1e293b" stroke-width="1" />
    <text x="35" y="67" font-size="11" font-weight="600" fill="#334155">Composicion (Ciclo de vida acoplado: Paciente a Historia a RegistroConsulta)</text>

    <line x1="16" y1="82" x2="28" y2="82" stroke="#334155" stroke-width="1.8" />
    <text x="35" y="85" font-size="11" font-weight="600" fill="#334155">Asociacion (Multiplicidad explicita 1 a muchos: Paciente/Medico con Citas)</text>

    <!-- Reglas de negocio mapeadas -->
    <line x1="15" y1="96" x2="555" y2="96" stroke="#f1f5f9" stroke-width="1" />
    <text x="15" y="112" font-size="11" font-weight="700" fill="#0f766e">Trazabilidad con Reglas de Negocio (ERS V6):</text>
    <text x="15" y="128" font-size="11" fill="#475569">&#8226; <tspan font-weight="600">RN-01 y RN-08:</tspan> Baja medica controlada por atributo 'activo'; bloqueo si hay citas AGENDADA.</text>
    <text x="15" y="144" font-size="11" fill="#475569">&#8226; <tspan font-weight="600">RN-02:</tspan> Prevencion de colision horaria por combinacion unica (medico + fechaHora).</text>
    <text x="15" y="160" font-size="11" fill="#475569">&#8226; <tspan font-weight="600">RN-06:</tspan> Transicion obligatoria: RegistroConsulta marca la cita vinculada a ATENDIDA.</text>
    <text x="15" y="176" font-size="11" fill="#475569">&#8226; <tspan font-weight="600">RN-04 y RN-05:</tspan> Metodos de validacion para telefono (mayor o igual a 7 digitos) y edad laboral medico (18 a 99 anos).</text>
  </g>

</svg>