<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Sombra suave para cajas -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.10" flood-color="#0f172a" />
    </filter>

    <!-- Flecha de transicion -->
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 1, 8 4.5, 0 8" fill="#334155" />
    </marker>

    <!-- Flecha de error / excepcion -->
    <marker id="arrow-error" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <polygon points="0 1, 8 4.5, 0 8" fill="#dc2626" />
    </marker>
  </defs>

  <!-- ================= ENCABEZADO ================= -->
  <rect x="30" y="20" width="1140" height="70" rx="8" fill="#1e293b" filter="url(#shadow)" />
  <text x="50" y="48" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="0.5">SISTEMA DE GESTION DE CLINICA MEDICA (SGCM) — DIAGRAMA DE ACTIVIDADES</text>
  <text x="50" y="72" fill="#94a3b8" font-size="13">Proceso: Agendamiento y Validacion de Citas Medicas | Coherencia con HU-07, RF-07 y Reglas de Negocio RN-02 y RN-08</text>

  <!-- ================= CARRILES / SWIMLANES (PARTICIONES) ================= -->
  <!-- 1. Recepcionista -->
  <rect x="30" y="105" width="240" height="945" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="30" y="105" width="240" height="38" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="150" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Recepcionista (Actor)</text>

  <!-- 2. Frontend / Interfaz Web -->
  <rect x="270" y="105" width="280" height="945" fill="#fcfdff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="270" y="105" width="280" height="38" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="410" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Frontend (Interfaz Web)</text>

  <!-- 3. Backend / Logica de Negocio -->
  <rect x="550" y="105" width="370" height="945" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="550" y="105" width="370" height="38" fill="#f5f3ff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="735" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">Backend (Logica de Negocio SGCM)</text>

  <!-- 4. Base de Datos -->
  <rect x="920" y="105" width="250" height="945" fill="#fcfdff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="920" y="105" width="250" height="38" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="1045" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">Base de Datos (Persistencia)</text>

  <!-- ================= FLUJO DE ACTIVIDADES ================= -->

  <!-- 1. Nodo Inicial -->
  <circle cx="150" cy="175" r="14" fill="#0f172a" />
  <line x1="150" y1="189" x2="150" y2="215" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 1: Solicitar agendamiento -->
  <rect x="65" y="215" width="170" height="42" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <text x="150" y="240" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">Acceder a "Agendar Cita"</text>

  <line x1="150" y1="257" x2="150" y2="285" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 2: Ingresar datos -->
  <rect x="60" y="285" width="180" height="50" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <text x="150" y="306" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Ingresar ID Paciente,</text>
  <text x="150" y="324" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">ID Medico y Fecha/Hora</text>

  <!-- Transicion al Frontend -->
  <line x1="240" y1="310" x2="310" y2="310" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 3: Validacion en Cliente -->
  <rect x="310" y="287" width="200" height="46" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)" />
  <text x="410" y="307" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Validar completitud de campos</text>
  <text x="410" y="323" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">y formato de fecha/hora</text>

  <line x1="410" y1="333" x2="410" y2="365" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Decision 1: Formulario valido? -->
  <polygon points="410 365, 435 385, 410 405, 385 385" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
  
  <!-- Rama No Valido (Frontend) -->
  <line x1="385" y1="385" x2="330" y2="385" stroke="#dc2626" stroke-width="1.5" />
  <line x1="330" y1="385" x2="330" y2="365" stroke="#dc2626" stroke-width="1.5" />
  <line x1="330" y1="365" x2="200" y2="365" stroke="#dc2626" stroke-width="1.5" />
  <line x1="200" y1="365" x2="200" y2="335" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-error)" />
  <text x="345" y="380" font-size="10" font-weight="700" fill="#dc2626">[Datos invalidos]</text>

  <!-- Rama Si Valido (Pasa a Backend) -->
  <line x1="435" y1="385" x2="600" y2="385" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="460" y="378" font-size="10.5" font-weight="700" fill="#15803d">[Datos validos]</text>

  <!-- Actividad 4: Verificar Paciente y Medico en BD -->
  <rect x="600" y="362" width="270" height="46" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)" />
  <text x="735" y="382" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Buscar registros de Paciente y Medico</text>
  <text x="735" y="398" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">findById(pacienteId), findById(medicoId)</text>

  <line x1="735" y1="408" x2="735" y2="445" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Decision 2: Existen en el sistema? -->
  <polygon points="735 445, 760 465, 735 485, 710 465" fill="#ffffff" stroke="#334155" stroke-width="1.5" />

  <!-- Rama No existen -->
  <line x1="710" y1="465" x2="480" y2="465" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-error)" />
  <text x="540" y="458" font-size="10" font-weight="700" fill="#dc2626">[No existen]</text>
  
  <rect x="310" y="445" width="170" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
  <text x="395" y="468" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c">Notificar: "ID no encontrado"</text>

  <line x1="310" y1="465" x2="190" y2="465" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-error)" />

  <!-- Fin por error 1 -->
  <circle cx="170" cy="465" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <circle cx="170" cy="465" r="8" fill="#dc2626" />

  <!-- Rama Si existen -> Validar RN-08 Medico Activo -->
  <line x1="735" y1="485" x2="735" y2="520" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="745" y="505" font-size="10.5" font-weight="700" fill="#15803d">[Existen]</text>

  <!-- Actividad 5: Validar RN-08 -->
  <rect x="610" y="520" width="250" height="46" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)" />
  <text x="735" y="540" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Validar Estado de Medico (RN-08)</text>
  <text x="735" y="556" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">isActivo() == true</text>

  <line x1="735" y1="566" x2="735" y2="600" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Decision 3: Medico activo? -->
  <polygon points="735 600, 760 620, 735 640, 710 620" fill="#ffffff" stroke="#334155" stroke-width="1.5" />

  <!-- Rama Inactivo -->
  <line x1="710" y1="620" x2="490" y2="620" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-error)" />
  <text x="560" y="613" font-size="10" font-weight="700" fill="#dc2626">[Inactivo (RN-08)]</text>

  <rect x="310" y="600" width="180" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
  <text x="400" y="623" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c">Notificar: "Medico inactivo"</text>

  <line x1="310" y1="620" x2="190" y2="620" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-error)" />

  <!-- Fin por error 2 -->
  <circle cx="170" cy="620" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <circle cx="170" cy="620" r="8" fill="#dc2626" />

  <!-- Rama Activo -> Consultar disponibilidad de horario (RN-02) -->
  <line x1="735" y1="640" x2="735" y2="675" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="745" y="660" font-size="10.5" font-weight="700" fill="#15803d">[Activo]</text>

  <!-- Actividad 6: Consultar conflicto en BD -->
  <rect x="600" y="675" width="270" height="46" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)" />
  <text x="735" y="695" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Consultar citas del medico en horario</text>
  <text x="735" y="711" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">Verificar colision horaria exacta (RN-02)</text>

  <line x1="870" y1="698" x2="950" y2="698" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad BD: Verificacion SQL -->
  <rect x="950" y="675" width="190" height="46" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow)" />
  <text x="1045" y="695" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">Ejecutar conteo de citas:</text>
  <text x="1045" y="711" text-anchor="middle" font-size="10.5" fill="#334155">estado = 'AGENDADA'</text>

  <line x1="950" y1="715" x2="755" y2="745" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />

  <!-- Decision 4: Horario disponible? -->
  <polygon points="735 745, 760 765, 735 785, 710 765" fill="#ffffff" stroke="#334155" stroke-width="1.5" />

  <!-- Rama Conflicto Horario -->
  <line x1="710" y1="765" x2="500" y2="765" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-error)" />
  <text x="560" y="758" font-size="10" font-weight="700" fill="#dc2626">[Ocupado (RN-02)]</text>

  <rect x="310" y="745" width="190" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2" />
  <text x="405" y="768" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c">Notificar: "Conflicto de horario"</text>

  <line x1="310" y1="765" x2="190" y2="765" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-error)" />

  <!-- Fin por error 3 -->
  <circle cx="170" cy="765" r="13" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <circle cx="170" cy="765" r="8" fill="#dc2626" />

  <!-- Rama Disponible -> Persistir Cita -->
  <line x1="735" y1="785" x2="735" y2="820" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="745" y="805" font-size="10.5" font-weight="700" fill="#15803d">[Disponible]</text>

  <!-- Actividad 7: Instanciar Cita -->
  <rect x="610" y="820" width="250" height="46" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)" />
  <text x="735" y="840" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Crear instancia de Cita</text>
  <text x="735" y="856" text-anchor="middle" font-size="11" font-style="italic" fill="#475569">setEstado(EstadoCita.AGENDADA)</text>

  <line x1="860" y1="843" x2="950" y2="843" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 8: Guardar en BD -->
  <rect x="950" y="820" width="190" height="46" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow)" />
  <text x="1045" y="840" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">Insertar Cita y generar ID</text>
  <text x="1045" y="856" text-anchor="middle" font-size="10.5" fill="#334155">COMMIT de transaccion</text>

  <!-- Transicion de retorno a Backend -->
  <line x1="1045" y1="866" x2="1045" y2="905" stroke="#334155" stroke-width="1.5" />
  <line x1="1045" y1="905" x2="860" y2="905" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 9: Responder 201 Created -->
  <rect x="610" y="885" width="250" height="42" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)" />
  <text x="735" y="910" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Responder HTTP 201 Created</text>

  <line x1="610" y1="905" x2="510" y2="905" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 10: Renderizar confirmacion en UI -->
  <rect x="310" y="885" width="200" height="42" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)" />
  <text x="410" y="910" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Mostrar mensaje de confirmacion</text>

  <line x1="310" y1="905" x2="240" y2="905" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Actividad 11: Recepcionista visualiza cita agendada -->
  <rect x="60" y="885" width="180" height="42" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5" filter="url(#shadow)" />
  <text x="150" y="910" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">Visualizar Cita Agendada (ID)</text>

  <line x1="150" y1="927" x2="150" y2="965" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- Nodo Final de Exito -->
  <circle cx="150" cy="980" r="15" fill="#ffffff" stroke="#15803d" stroke-width="2" />
  <circle cx="150" cy="980" r="9" fill="#15803d" />
  <text x="150" y="1015" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Fin (Cita Registrada)</text>

</svg>
