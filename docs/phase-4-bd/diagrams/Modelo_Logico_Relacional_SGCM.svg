    <text x="15" y="23" font-size="13" font-weight="800" fill="#c2410c">&#128196; citas</text>
    <line x1="0" y1="36" x2="300" y2="36" stroke="#fed7aa" stroke-width="1.5" />

    <rect x="8" y="44" width="28" height="18" rx="3" fill="#fef08a" />
    <text x="13" y="57" font-size="10" font-weight="800" fill="#854d0e">PK</text>
    <text x="44" y="58" font-size="11.5" font-weight="700" fill="#0f172a">id</text>
    <text x="150" y="58" font-size="11" fill="#475569">BIGINT IDENTITY</text>
    <text x="235" y="58" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <rect x="8" y="70" width="28" height="18" rx="3" fill="#bfdbfe" />
    <text x="13" y="83" font-size="10" font-weight="800" fill="#1e40af">FK</text>
    <text x="44" y="84" font-size="11.5" font-weight="700" fill="#1e40af">paciente_id</text>
    <text x="150" y="84" font-size="11" fill="#475569">VARCHAR(20)</text>
    <text x="235" y="84" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <rect x="8" y="96" width="28" height="18" rx="3" fill="#bfdbfe" />
    <text x="13" y="109" font-size="10" font-weight="800" fill="#1e40af">FK</text>
    <text x="44" y="110" font-size="11.5" font-weight="700" fill="#0f766e">medico_id</text>
    <text x="150" y="110" font-size="11" fill="#475569">VARCHAR(20)</text>
    <text x="235" y="110" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="136" font-size="11.5" font-weight="600" fill="#0f172a">fecha_hora</text>
    <text x="150" y="136" font-size="11" fill="#475569">TIMESTAMP</text>
    <text x="235" y="136" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="162" font-size="11.5" font-weight="600" fill="#0f172a">estado</text>
    <text x="150" y="162" font-size="11" fill="#475569">VARCHAR(15)</text>
    <text x="235" y="162" font-size="10" fill="#0284c7">AGENDADA</text>

    <text x="44" y="188" font-size="11.5" font-weight="600" fill="#0f172a">motivo</text>
    <text x="150" y="188" font-size="11" fill="#475569">VARCHAR(255)</text>
    <text x="235" y="188" font-size="10" fill="#94a3b8">NULLABLE</text>

    <text x="44" y="210" font-size="11" fill="#64748b">created_at</text>
    <text x="150" y="210" font-size="11" fill="#64748b">TIMESTAMP</text>
    <text x="235" y="210" font-size="10" fill="#64748b">DEFAULT</text>

    <line x1="8" y1="222" x2="292" y2="222" stroke="#e2e8f0" stroke-width="1" />
    <text x="12" y="238" font-size="9.5" font-style="italic" fill="#c2410c">&#9881; UNIQUE(medico_id, fecha_hora) | CHECK(estado IN ('AGENDADA','ATENDIDA','CANCELADA'))</text>
  </g>

  <!-- ================= TABLA 5: REGISTROS_CONSULTA ================= -->
  <g transform="translate(130, 700)" filter="url(#shadow)">
    <rect width="320" height="245" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="2" />
    <path d="M 0 0 L 320 0 L 320 36 L 0 36 Z" fill="#fef3c7" />
    <text x="15" y="23" font-size="13" font-weight="800" fill="#92400e">&#128196; registros_consulta</text>
    <line x1="0" y1="36" x2="320" y2="36" stroke="#fde68a" stroke-width="1.5" />

    <rect x="8" y="44" width="28" height="18" rx="3" fill="#fef08a" />
    <text x="13" y="57" font-size="10" font-weight="800" fill="#854d0e">PK</text>
    <text x="44" y="58" font-size="11.5" font-weight="700" fill="#0f172a">id</text>
    <text x="160" y="58" font-size="11" fill="#475569">BIGINT IDENTITY</text>
    <text x="255" y="58" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <rect x="8" y="70" width="28" height="18" rx="3" fill="#bfdbfe" />
    <text x="13" y="83" font-size="10" font-weight="800" fill="#1e40af">FK</text>
    <text x="44" y="84" font-size="11.5" font-weight="700" fill="#6d28d9">historia_clinica_id</text>
    <text x="160" y="84" font-size="11" fill="#475569">BIGINT</text>
    <text x="255" y="84" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <rect x="8" y="96" width="28" height="18" rx="3" fill="#bfdbfe" />
    <text x="13" y="109" font-size="10" font-weight="800" fill="#1e40af">FK</text>
    <text x="44" y="110" font-size="11.5" font-weight="700" fill="#c2410c">cita_id</text>
    <text x="160" y="110" font-size="11" fill="#475569">BIGINT</text>
    <text x="255" y="110" font-size="10" font-weight="600" fill="#94a3b8">NULLABLE</text>

    <rect x="8" y="122" width="28" height="18" rx="3" fill="#bfdbfe" />
    <text x="13" y="135" font-size="10" font-weight="800" fill="#1e40af">FK</text>
    <text x="44" y="136" font-size="11.5" font-weight="700" fill="#0f766e">medico_id</text>
    <text x="160" y="136" font-size="11" fill="#475569">VARCHAR(20)</text>
    <text x="255" y="136" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="160" font-size="11.5" font-weight="600" fill="#0f172a">fecha_hora</text>
    <text x="160" y="160" font-size="11" fill="#475569">TIMESTAMP</text>
    <text x="255" y="160" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="184" font-size="11.5" font-weight="600" fill="#0f172a">diagnostico</text>
    <text x="160" y="184" font-size="11" fill="#475569">TEXT</text>
    <text x="255" y="184" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="206" font-size="11.5" font-weight="600" fill="#0f172a">tratamiento</text>
    <text x="160" y="206" font-size="11" fill="#475569">TEXT</text>
    <text x="255" y="206" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <line x1="8" y1="218" x2="312" y2="218" stroke="#e2e8f0" stroke-width="1" />
    <text x="12" y="234" font-size="9.5" font-style="italic" fill="#b45309">&#9881; FKs a historias_clinicas, citas y medicos (ON DELETE RESTRICT)</text>
  </g>

  <!-- ================= PANEL DE DICCIONARIO E INDICES ================= -->
  <g transform="translate(860, 440)" filter="url(#shadow)">
    <rect width="460" height="505" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="460" height="34" rx="8" fill="#f8fafc" />
    <text x="15" y="22" font-size="13" font-weight="800" fill="#0f172a">INDICES, INTEGRIDAD REFERENCIAL Y REGLAS SQL</text>
    <line x1="0" y1="34" x2="460" y2="34" stroke="#e2e8f0" stroke-width="1.2" />

    <text x="15" y="58" font-size="11.5" font-weight="700" fill="#0284c7">&#128269; Indices Optimizados de Rendimiento:</text>
    <text x="25" y="76" font-size="11" fill="#334155">&#8226; <tspan font-weight="600">idx_citas_medico_fecha:</tspan> En (medico_id, fecha_hora).</text>
    <text x="25" y="94" font-size="11" fill="#334155">&#8226; <tspan font-weight="600">idx_citas_paciente:</tspan> En (paciente_id, estado).</text>
    <text x="25" y="112" font-size="11" fill="#334155">&#8226; <tspan font-weight="600">idx_registros_historia_fecha:</tspan> En (historia_clinica_id, fecha_hora DESC).</text>

    <line x1="15" y1="126" x2="445" y2="126" stroke="#f1f5f9" stroke-width="1" />
    <text x="15" y="146" font-size="11.5" font-weight="700" fill="#0f766e">&#128274; Politicas de Integridad Referencial:</text>
    <text x="25" y="166" font-size="11" fill="#334155">&#8226; <tspan font-weight="600">pacientes ➔ historias_clinicas:</tspan> ON DELETE CASCADE.</text>
    <text x="25" y="184" font-size="11" fill="#334155">&#8226; <tspan font-weight="600">medicos ➔ citas / registros:</tspan> ON DELETE RESTRICT (RN-08).</text>
    <text x="25" y="202" font-size="11" fill="#334155">&#8226; <tspan font-weight="600">citas ➔ registros_consulta:</tspan> ON DELETE SET NULL.</text>

    <line x1="15" y1="218" x2="445" y2="218" stroke="#f1f5f9" stroke-width="1" />
    <text x="15" y="238" font-size="11.5" font-weight="700" fill="#7c3aed">&#9745; Cumplimiento de Normalizacion (3FN):</text>
    <text x="25" y="258" font-size="11" fill="#334155">&#8226; <tspan font-weight="600">1FN Cumplida:</tspan> Atributos atomicos, sin grupos repetitivos.</text>
    <text x="25" y="278" font-size="11" fill="#334155">&#8226; <tspan font-weight="600">2FN Cumplida:</tspan> PKs unicas simples; dependencias completas.</text>
    <text x="25" y="298" font-size="11" fill="#334155">&#8226; <tspan font-weight="600">3FN Cumplida:</tspan> Cero dependencias transitivas entre no-claves.</text>

    <line x1="15" y1="316" x2="445" y2="316" stroke="#f1f5f9" stroke-width="1" />
    <text x="15" y="336" font-size="11.5" font-weight="700" fill="#b45309">&#128640; Estandares Tecnologicos:</text>
    <text x="25" y="356" font-size="11" fill="#334155">&#8226; Sintaxis 100% ANSI SQL compatible con PostgreSQL 14+, MySQL 8+, SQLite 3.</text>
    <text x="25" y="374" font-size="11" fill="#334155">&#8226; Nombres snake_case estandar en minusculas.</text>

    <rect x="20" y="420" width="420" height="65" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
