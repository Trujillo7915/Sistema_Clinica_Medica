    <text x="44" y="58" font-size="11.5" font-weight="700" fill="#0f172a">id</text>
    <text x="150" y="58" font-size="11" fill="#475569">VARCHAR(20)</text>
    <text x="235" y="58" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="84" font-size="11.5" font-weight="600" fill="#0f172a">nombre</text>
    <text x="150" y="84" font-size="11" fill="#475569">VARCHAR(100)</text>
    <text x="235" y="84" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="110" font-size="11.5" font-weight="600" fill="#0f172a">edad</text>
    <text x="150" y="110" font-size="11" fill="#475569">INT</text>
    <text x="235" y="110" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="136" font-size="11.5" font-weight="600" fill="#0f172a">telefono</text>
    <text x="150" y="136" font-size="11" fill="#475569">VARCHAR(20)</text>
    <text x="235" y="136" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="162" font-size="11.5" font-weight="600" fill="#0f172a">especialidad</text>
    <text x="150" y="162" font-size="11" fill="#475569">VARCHAR(100)</text>
    <text x="235" y="162" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="188" font-size="11.5" font-weight="600" fill="#0f172a">activo</text>
    <text x="150" y="188" font-size="11" fill="#475569">BOOLEAN</text>
    <text x="235" y="188" font-size="10" fill="#16a34a">DEF TRUE</text>

    <text x="44" y="212" font-size="11" fill="#64748b">created_at</text>
    <text x="150" y="212" font-size="11" fill="#64748b">TIMESTAMP</text>
    <text x="235" y="212" font-size="10" fill="#64748b">DEFAULT</text>

    <line x1="8" y1="224" x2="292" y2="224" stroke="#e2e8f0" stroke-width="1" />
    <text x="12" y="240" font-size="10" font-style="italic" fill="#0d9488">&#9881; CHECK: edad BETWEEN 18 AND 99</text>
  </g>

  <!-- ================= TABLA 3: HISTORIAS_CLINICAS ================= -->
  <g transform="translate(40, 440)" filter="url(#shadow)">
    <rect width="300" height="180" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
    <path d="M 0 0 L 300 0 L 300 36 L 0 36 Z" fill="#f5f3ff" />
    <text x="15" y="23" font-size="13" font-weight="800" fill="#6d28d9">&#128196; historias_clinicas</text>
    <line x1="0" y1="36" x2="300" y2="36" stroke="#ddd6fe" stroke-width="1.5" />

    <rect x="8" y="44" width="28" height="18" rx="3" fill="#fef08a" />
    <text x="13" y="57" font-size="10" font-weight="800" fill="#854d0e">PK</text>
    <text x="44" y="58" font-size="11.5" font-weight="700" fill="#0f172a">id</text>
    <text x="150" y="58" font-size="11" fill="#475569">BIGINT IDENTITY</text>
    <text x="235" y="58" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <rect x="8" y="72" width="28" height="18" rx="3" fill="#bfdbfe" />
    <text x="13" y="85" font-size="10" font-weight="800" fill="#1e40af">FK</text>
    <text x="44" y="86" font-size="11.5" font-weight="700" fill="#1e40af">paciente_id</text>
    <text x="150" y="86" font-size="11" fill="#475569">VARCHAR(20)</text>
    <text x="235" y="86" font-size="10" font-weight="700" fill="#7c3aed">UQ / NN</text>

    <text x="44" y="114" font-size="11.5" font-weight="600" fill="#0f172a">fecha_creacion</text>
    <text x="150" y="114" font-size="11" fill="#475569">DATE</text>
    <text x="235" y="114" font-size="10" fill="#64748b">DEF CURDATE</text>

    <text x="44" y="140" font-size="11" fill="#64748b">created_at</text>
    <text x="150" y="140" font-size="11" fill="#64748b">TIMESTAMP</text>
    <text x="235" y="140" font-size="10" fill="#64748b">DEFAULT</text>

    <line x1="8" y1="154" x2="292" y2="154" stroke="#e2e8f0" stroke-width="1" />
    <text x="12" y="168" font-size="10" font-style="italic" fill="#6d28d9">&#9881; FK paciente_id ➔ pacientes(id) ON DELETE CASCADE</text>
  </g>

