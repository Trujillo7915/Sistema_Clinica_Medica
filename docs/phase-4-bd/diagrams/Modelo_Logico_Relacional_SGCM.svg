<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 980" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Sombra suave para cajas -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.10" flood-color="#0f172a" />
    </filter>

    <!-- Marcadores Pata de Gallo (Crow's Foot) -->
    <marker id="one-mandatory" markerWidth="14" markerHeight="14" refX="1" refY="7" orient="auto">
      <line x1="4" y1="2" x2="4" y2="12" stroke="#1e293b" stroke-width="2" />
      <line x1="9" y1="2" x2="9" y2="12" stroke="#1e293b" stroke-width="2" />
    </marker>

    <marker id="many-optional" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto">
      <circle cx="5" cy="9" r="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
      <line x1="9" y1="9" x2="17" y2="2" stroke="#1e293b" stroke-width="2" />
      <line x1="9" y1="9" x2="17" y2="9" stroke="#1e293b" stroke-width="2" />
      <line x1="9" y1="9" x2="17" y2="16" stroke="#1e293b" stroke-width="2" />
    </marker>

    <marker id="one-optional" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto">
      <circle cx="5" cy="7" r="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" />
      <line x1="12" y1="2" x2="12" y2="12" stroke="#1e293b" stroke-width="2" />
    </marker>
  </defs>

  <!-- ================= ENCABEZADO ================= -->
  <rect x="30" y="20" width="1300" height="74" rx="8" fill="#1e293b" filter="url(#shadow)" />
  <text x="55" y="48" fill="#ffffff" font-size="19" font-weight="700" letter-spacing="0.5">SISTEMA DE GESTION DE CLINICA MEDICA (SGCM) — MODELO LOGICO RELACIONAL</text>
  <text x="55" y="73" fill="#94a3b8" font-size="13">Fase 4: Esquema Fisico/Logico de Tablas (DDL) | Notacion Crow's Foot (Pata de Gallo) | Normalizado 3FN</text>

  <!-- ================= RELACIONES / LINEAS CROW'S FOOT ================= -->
  <path d="M 270 240 L 190 240 L 190 440" fill="none" stroke="#1e293b" stroke-width="2" marker-start="url(#one-mandatory)" marker-end="url(#one-mandatory)" />
  <text x="140" y="340" font-size="11" font-weight="700" fill="#1e40af">1 : 1 (paciente_id)</text>

  <path d="M 190 620 L 190 700" fill="none" stroke="#1e293b" stroke-width="2" marker-start="url(#one-mandatory)" marker-end="url(#many-optional)" />
  <text x="200" y="660" font-size="11" font-weight="700" fill="#6d28d9">1 : N (historia_id)</text>

  <path d="M 570 240 L 640 240 L 640 440" fill="none" stroke="#1e293b" stroke-width="2" marker-start="url(#one-mandatory)" marker-end="url(#many-optional)" />
  <text x="650" y="340" font-size="11" font-weight="700" fill="#1e40af">1 : N (paciente_id)</text>

  <path d="M 790 240 L 730 240 L 730 440" fill="none" stroke="#1e293b" stroke-width="2" marker-start="url(#one-mandatory)" marker-end="url(#many-optional)" />
  <text x="740" y="340" font-size="11" font-weight="700" fill="#0f766e">1 : N (medico_id)</text>

  <path d="M 1090 240 L 1150 240 L 1150 820 L 450 820" fill="none" stroke="#1e293b" stroke-width="2" marker-start="url(#one-mandatory)" marker-end="url(#many-optional)" />
  <text x="1040" y="810" font-size="11" font-weight="700" fill="#0f766e">1 : N (medico_id)</text>

  <path d="M 685 690 L 685 760 L 450 760" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5,4" marker-start="url(#one-mandatory)" marker-end="url(#one-optional)" />
  <text x="540" y="752" font-size="11" font-weight="700" fill="#c2410c">0..1 : 1 (cita_id)</text>

  <!-- ================= TABLA 1: PACIENTES ================= -->
  <g transform="translate(270, 140)" filter="url(#shadow)">
    <rect width="300" height="230" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <path d="M 0 0 L 300 0 L 300 36 L 0 36 Z" fill="#eff6ff" />
    <text x="15" y="23" font-size="13" font-weight="800" fill="#1e40af">&#128196; pacientes</text>
    <line x1="0" y1="36" x2="300" y2="36" stroke="#bfdbfe" stroke-width="1.5" />

    <rect x="8" y="44" width="28" height="18" rx="3" fill="#fef08a" />
    <text x="13" y="57" font-size="10" font-weight="800" fill="#854d0e">PK</text>
    <text x="44" y="58" font-size="11.5" font-weight="700" fill="#0f172a">id</text>
    <text x="150" y="58" font-size="11" fill="#475569">VARCHAR(20)</text>
    <text x="235" y="58" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="84" font-size="11.5" font-weight="600" fill="#0f172a">nombre</text>
    <text x="150" y="84" font-size="11" fill="#475569">VARCHAR(100)</text>
    <text x="235" y="84" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="110" font-size="11.5" font-weight="600" fill="#0f172a">edad</text>
    <text x="150" y="110" font-size="11" fill="#475569">INT</text>
    <text x="235" y="110" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="136" font-size="11.5" font-weight="600" fill="#0f172a">telefono</text>
    <text x="150" y="136" font-size="11" fill="#475569">VARCHAR(20)</text>
    <text x="235" y="136" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="162" font-size="11.5" font-weight="600" fill="#0f172a">direccion</text>
    <text x="150" y="162" font-size="11" fill="#475569">VARCHAR(255)</text>
    <text x="235" y="162" font-size="10" font-weight="600" fill="#dc2626">NOT NULL</text>

    <text x="44" y="188" font-size="11" fill="#64748b">created_at</text>
    <text x="150" y="188" font-size="11" fill="#64748b">TIMESTAMP</text>
    <text x="235" y="188" font-size="10" fill="#64748b">DEFAULT</text>

    <line x1="8" y1="202" x2="292" y2="202" stroke="#e2e8f0" stroke-width="1" />
    <text x="12" y="218" font-size="10" font-style="italic" fill="#2563eb">&#9881; CHECK: LENGTH(telefono) >= 7</text>
  </g>

